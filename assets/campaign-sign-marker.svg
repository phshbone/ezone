<svg xmlns="http://www.w3.org/2000/svg" width="256" height="360" viewBox="0 0 256 360" role="img" aria-label="Campaign sign marker">
  <defs>
    <linearGradient id="pole" x1="0" x2="1">
      <stop offset="0" stop-color="#2d3138"/>
      <stop offset="0.45" stop-color="#6a7079"/>
      <stop offset="0.7" stop-color="#2b2f35"/>
      <stop offset="1" stop-color="#111318"/>
